name: Test

on:
  - push
  - pull_request

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Install deps
        run: pnpm ci

      - name: Linter test
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run type-check

      - name: Build
        env:
          BUNDLE_ANALYSIS: ${{ matrix.node-version == 24 && 'true' || '' }}
        run: pnpm run build

      - name: Unit test and save results
        env:
          TEST_REPORT: ${{ matrix.node-version == 24 && 'true' || '' }}
        run: pnpm run test:coverage

      - name: Upload test results
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true

      - name: Install Playwright Chromium
        if: ${{ matrix.node-version == 24 }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        if: ${{ matrix.node-version == 24 }}
        run: pnpm test:browser
