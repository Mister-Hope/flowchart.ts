name: Test

on:
  - push
  - pull_request

permissions:
  contents: read
  id-token: write

# Cancel superseded runs for PRs / feature branches, but never cancel or queue a run on `main`:
# a fast merge should not turn the previous main run into a red X.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Linter test
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run type-check

      - name: Build
        env:
          BUNDLE_ANALYSIS: ${{ matrix.node-version == 24 && 'true' || '' }}
        run: pnpm run build

      - name: Unit test and save results
        env:
          TEST_REPORT: ${{ matrix.node-version == 24 && 'true' || '' }}
        run: pnpm run test:coverage

      - name: Upload test results
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true

      - name: Cache Playwright browsers
        if: ${{ matrix.node-version == 24 }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: ${{ matrix.node-version == 24 }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        if: ${{ matrix.node-version == 24 }}
        run: pnpm test:browser
